<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mapa comunitario de Barinas</title>
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="pac-map.css">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,#map{height:100%;width:100%;margin:0;background:#09090b;font-family:system-ui,sans-serif;color:#fff}
    body{overflow:hidden}
    .leaflet-container{background:#09090b}
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#18181b;color:#fff;border:1px solid #3f3f46}
    .leaflet-popup-content{margin:12px}
    .map-controls{position:absolute;top:8px;right:8px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 56px)}
    .map-controls button{min-height:40px;padding:8px;border:1px solid #52525b;border-radius:8px;background:#18181bee;color:#fff;font:600 11px system-ui,sans-serif;cursor:pointer}
    button:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}
    button[aria-pressed=true]{border-color:#38bdf8;color:#7dd3fc}
    #mapStatus{position:absolute;left:8px;bottom:24px;z-index:1000;max-width:calc(100% - 16px);padding:5px 8px;border-radius:6px;background:#18181bee;color:#e2e8f0;font-size:10px;pointer-events:none;overflow-wrap:anywhere}
    @media(max-height:260px){.map-controls button{min-height:34px;padding:6px}#mapStatus{font-size:9px}}
  </style>
  <script src="leaflet.js" defer></script>
  <script src="leaflet-heat.js" defer></script>
  <script src="pac-map-core.js" defer></script>
  <script src="pac-map-app.js" defer></script>
</head>
<body>
  <div id="map" role="region" aria-label="Mapa interactivo de sectores de Barinas"></div>
  <nav class="map-controls" aria-label="Controles del mapa">
    <button id="btnHeatmap" type="button" aria-pressed="false">Calor</button>
    <button id="btnBasemap" type="button">Satélite</button>
    <button id="btnCenter" type="button">Centrar</button>
  </nav>
  <div id="mapStatus" role="status" aria-live="polite">Cargando mapa…</div>
</body>
</html>
