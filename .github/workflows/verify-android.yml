name: Android verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and Android lint
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
            app/build/test-results/
          if-no-files-found: ignore
